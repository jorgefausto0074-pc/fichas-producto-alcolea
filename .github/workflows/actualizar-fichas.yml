name: Actualizar fichas
run-name: actualizar ${{ inputs.modo }} ${{ inputs.solicitud }}

on:
  workflow_dispatch:
    inputs:
      modo:
        description: revisar o aplicar
        required: true
        type: choice
        options:
          - revisar
          - aplicar
      solicitud:
        description: Identificador de esta petición
        required: false
        default: manual
        type: string

concurrency:
  group: actualizar-fichas
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Dependencias
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r updater/requirements.txt

      - name: Revisar o aplicar
        env:
          PT_PASSWORD: ${{ secrets.PT_PASSWORD }}
          MODO: ${{ inputs.modo }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # La actualización pendiente vive en la rama actualizacion-pendiente (commit sin padres
          # con los ficheros cifrados). El navegador la crea por api.github.com.
          PEND=actualizacion-pendiente
          DIRP="${RUNNER_TEMP}/pendiente"
          mkdir -p actualizacion/out
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git fetch -q --depth 1 origin "refs/heads/${PEND}"; then
            echo "No hay una actualización pendiente (rama ${PEND})." >&2
            exit 1
          fi
          git worktree add -q --detach "${DIRP}" FETCH_HEAD
          bajar() {
            if [ ! -f "${DIRP}/$1" ]; then
              echo "Falta $1." >&2
              exit 1
            fi
            cp "${DIRP}/$1" "actualizacion/$1"
          }
          subir() {
            cp "$2" "${DIRP}/$1"
          }
          guardar_pendiente() {
            git -C "${DIRP}" add -A
            if ! git -C "${DIRP}" diff --cached --quiet; then
              git -C "${DIRP}" commit -q -m "Actualización pendiente: ${MODO}"
              git -C "${DIRP}" push -q origin "HEAD:refs/heads/${PEND}"
            fi
          }
          bajar entrada.enc
          bajar entrada.json
          if [ "${MODO}" = "aplicar" ]; then
            bajar informe.enc
            bajar informe.json
          fi
          set +e
          if [ "${MODO}" = "revisar" ]; then
            .venv/bin/python updater/ci_actualizar.py revisar --anterior . \
              --entrada actualizacion/entrada.enc --entrada-formato actualizacion/entrada.json \
              --salida actualizacion/out 2>actualizacion/stderr.txt
          else
            .venv/bin/python updater/ci_actualizar.py aplicar --anterior . \
              --entrada actualizacion/entrada.enc --entrada-formato actualizacion/entrada.json \
              --informe actualizacion/informe.enc --informe-formato actualizacion/informe.json \
              --salida actualizacion/out 2>actualizacion/stderr.txt
          fi
          code=$?
          set -e
          CODE="${code}" MODO="${MODO}" python - << 'PY'
          import json, os
          code = int(os.environ["CODE"])
          modo = os.environ["MODO"]
          stderr = ""
          path = "actualizacion/stderr.txt"
          if os.path.exists(path):
              stderr = open(path, encoding="utf-8", errors="replace").read()
          if code == 0:
              codigo = 0
          elif code == 2:
              codigo = 2
          elif "published datos.enc changed" in stderr:
              codigo = "base"
          else:
              codigo = 1
          json.dump({"ok": code == 0, "codigo": codigo, "modo": modo}, open("actualizacion/resultado.json", "w"), ensure_ascii=False)
          PY
          rm -f actualizacion/stderr.txt
          subir resultado.json actualizacion/resultado.json
          if [ "${code}" -eq 0 ] && [ "${MODO}" = "revisar" ]; then
            subir informe.enc actualizacion/out/informe.enc
            subir informe.json actualizacion/out/informe.json
          fi
          guardar_pendiente
          if [ "${code}" -ne 0 ]; then
            exit "${code}"
          fi
          if [ "${MODO}" != "aplicar" ]; then
            exit 0
          fi
          cp actualizacion/out/datos.enc datos.enc
          cp actualizacion/out/formato.json formato.json
          git add -- datos.enc formato.json
          python - << 'PY'
          import subprocess
          names = set(subprocess.check_output(["git", "diff", "--cached", "--name-only"], text=True).split())
          extra = names - {"datos.enc", "formato.json"}
          if extra:
              raise SystemExit("ERROR: el commit incluiría archivos que no son el paquete")
          PY
          if git diff --cached --quiet; then
            echo "El paquete no ha cambiado."
          else
            git commit -m "Datos: actualización aprobada"
            git push origin HEAD:main
          fi
          pages=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/pages/builds" || true)
          echo "pages_http=${pages}"
          git worktree remove --force "${DIRP}" || true
          git push -q origin --delete "${PEND}"
