name: APK Fichas Alcolea

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Etiqueta de la release (por ejemplo v1.0.0)
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Preparar firma
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/fichas-release.keystore"

      - name: Compilar APK firmada
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/fichas-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "../FichasAlcolea-${{ inputs.tag }}.apk"

      - name: Publicar en la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Fichas Alcolea ${{ inputs.tag }}
          files: FichasAlcolea-${{ inputs.tag }}.apk
          generate_release_notes: true
          body: |
            Aplicación Android que abre las fichas publicadas. No incluye datos de producto: cada actualización de la web llega al abrir la aplicación.
            https://jorgefausto0074-pc.github.io/fichas-producto-alcolea/
