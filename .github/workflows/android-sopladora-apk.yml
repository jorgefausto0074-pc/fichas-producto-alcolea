name: APK Calculadora Sopladora

on:
  pull_request:
    paths:
      - "sopladora/**"
      - ".github/workflows/android-sopladora-apk.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: Etiqueta de la release (por ejemplo sopladora-v1.0.0)
        required: true
        default: sopladora-v1.0.0

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - name: Preparar firma
        id: firma
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          presente() { if [ -n "$1" ]; then echo si; else echo no; fi; }
          echo "ANDROID_KEYSTORE_BASE64=$(presente "$ANDROID_KEYSTORE_BASE64")"
          echo "ANDROID_KEYSTORE_PASSWORD=$(presente "$ANDROID_KEYSTORE_PASSWORD")"
          echo "ANDROID_KEY_ALIAS=$(presente "$ANDROID_KEY_ALIAS")"
          echo "ANDROID_KEY_PASSWORD=$(presente "$ANDROID_KEY_PASSWORD")"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/fichas-release.keystore"
            echo "firmada=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "firmada=false" >> "$GITHUB_OUTPUT"
            echo "Este pull request no recibe los secretos de firma. Se comprueba que Gradle compila."
          else
            echo "Faltan los secretos de la misma keystore que Fichas." >&2
            echo "Hay que crearlos en Settings → Secrets and variables → Actions:" >&2
            echo "  ANDROID_KEYSTORE_BASE64 (keystore en base64, no el archivo .enc)" >&2
            echo "  ANDROID_KEYSTORE_PASSWORD" >&2
            echo "  ANDROID_KEY_ALIAS" >&2
            echo "  ANDROID_KEY_PASSWORD" >&2
            exit 1
          fi

      - name: Compilar APK
        working-directory: sopladora/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.firma.outputs.firmada == 'true' && format('{0}/fichas-release.keystore', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          test -n "$apk"
          cp "$apk" ../../CalculadoraSopladora.apk
          echo "APK: $(basename "$apk")"

      - name: Comprobar que el certificado es el de Fichas
        if: steps.firma.outputs.firmada == 'true'
        run: |
          python3 - << 'PY'
          import hashlib, struct, sys
          data = open("CalculadoraSopladora.apk", "rb").read()
          eocd = data.rfind(b"PK\x05\x06")
          cd = struct.unpack_from("<I", data, eocd + 16)[0]
          assert data[cd - 16:cd] == b"APK Sig Block 42"
          size = struct.unpack_from("<Q", data, cd - 24)[0]
          pairs = data[cd - size:cd - 24]
          off = 0
          val = None
          while off + 12 <= len(pairs):
              ln = struct.unpack_from("<Q", pairs, off)[0]
              pid = struct.unpack_from("<I", pairs, off + 8)[0]
              if pid == 0x7109871A:
                  val = pairs[off + 12:off + 8 + ln]
              off += 8 + ln
          idx = val.find(b"\x30\x82")
          ln = struct.unpack_from(">H", val, idx + 2)[0]
          fp = hashlib.sha256(val[idx:idx + 4 + ln]).hexdigest()
          esperado = "1d6748237a577be6c739f4f02cb1834fd4786e18fb14e4912382ef138eb00a60"
          print("certificado", fp[:8] + "…" + fp[-8:])
          if fp != esperado:
              sys.exit("El APK no está firmado con la keystore de Fichas Alcolea")
          PY

      - name: Subir el APK del flujo
        uses: actions/upload-artifact@v4
        with:
          name: CalculadoraSopladora
          path: CalculadoraSopladora.apk

      - name: Publicar en la release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Calculadora Sopladora ${{ inputs.tag }}
          files: CalculadoraSopladora.apk
          generate_release_notes: true
          body: |
            Aplicación Android que abre la Calculadora Sopladora publicada. No incluye los gramajes: cada actualización de la web llega al abrir la aplicación.
            https://jorgefausto0074-pc.github.io/fichas-producto-alcolea/sopladora/
