name: APK Calculadora Sopladora

on:
  pull_request:
    paths:
      - "sopladora/**"
      - ".github/workflows/android-sopladora-apk.yml"
  push:
    branches: [main]
    paths:
      - "sopladora/**"
      - ".github/workflows/android-sopladora-apk.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: Etiqueta de la release (por ejemplo sopladora-v1.0.0)
        required: true
        default: sopladora-v1.0.0

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - name: Preparar firma
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/fichas-release.keystore"

      - name: Compilar APK firmada
        working-directory: sopladora/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/fichas-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "../../CalculadoraSopladora.apk"

      - name: Subir el APK del flujo
        uses: actions/upload-artifact@v4
        with:
          name: CalculadoraSopladora
          path: CalculadoraSopladora.apk

      - name: Publicar en la release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Calculadora Sopladora ${{ inputs.tag }}
          files: CalculadoraSopladora.apk
          generate_release_notes: true
          body: |
            Aplicación Android que abre la Calculadora Sopladora publicada. No incluye los gramajes: cada actualización de la web llega al abrir la aplicación.
            https://jorgefausto0074-pc.github.io/fichas-producto-alcolea/sopladora/
