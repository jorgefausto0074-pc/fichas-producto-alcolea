name: Pruebas Calculadora Sopladora

on:
  pull_request:
    paths:
      - "sopladora/**"
      - ".github/workflows/sopladora-ci.yml"
      - "tests/actualizar.mjs"
  push:
    branches: [main]
    paths:
      - "sopladora/**"
      - ".github/workflows/sopladora-ci.yml"

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cifrado de prueba y sintaxis
        run: node sopladora/tests/cifrado.mjs

      - name: Una ficha nueva de prueba no bloquea la auditoría
        run: node sopladora/tests/ficha15.mjs

      - name: Fichas de producto sigue pasando sus pruebas de actualización
        run: node tests/actualizar.mjs
